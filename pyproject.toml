[project]
name = "shadow-voice"
version = "0.1.0"
description = "Shadow Voice - Dialer-Agnostic AI Voice Agent Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "aiohttp>=3.9.0",
    "prometheus-client>=0.20.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.4",
    "websockets>=17.1",
    "httpx>=0.28.1",
]

[project.scripts]
shadow-voice = "shadow_voice.main:main"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
